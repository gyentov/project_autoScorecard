    .bg{fill:#1a1a19} .t1{fill:#f0efec} .t2{fill:#c3c2b7}
    .bar{fill:#3987e5} .rule{stroke:#383835} .card{fill:#232322;stroke:#45443f}
  }
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
</style>
