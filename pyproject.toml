[project]
name = "autoscorecard"
version = "0.1.0"
description = "Stardew-style automodeler: agent-driven credit scorecard builder"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1,<2",
    "openai>=1",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "python-multipart",
    "numpy>=2",
    "pandas>=2.2",
    "openpyxl",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autoscorecard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
